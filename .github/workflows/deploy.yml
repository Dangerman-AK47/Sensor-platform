name: Deploy to Hostycare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Automatic Deploy to Hostycare
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Build Production Bundle
        run: node scripts/build-production-bundle.js

      # Deploy full platform (frontend + sensor_app backend) to public_html
      - name: 🌐 Sync Platform to Hostycare public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: realtimeprojectsolutions.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: public_html/
          local-dir: dist/hostycare_bundle/public_html/
          exclude: |
            **/.env*
            **/storage/uploads/**
            **/storage/logs/**
          dangerous-clean-slate: false
          log-level: verbose
