name: Deploy to Hostycare

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI if ever needed

jobs:
  deploy:
    name: 🚀 Automatic Deploy to Hostycare
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 1: Deploy public frontend files to public_html
      - name: 🌐 Deploy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: realtimeprojectsolutions.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: dist/hostycare_bundle/public_html/
          dangerous-clean-slate: false

      # Step 2: Deploy backend core files to sensor_app
      - name: ⚙️ Deploy sensor_app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: realtimeprojectsolutions.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: sensor_app/
          local-dir: dist/hostycare_bundle/sensor_app/
          exclude: |
            **/.env*
            **/storage/uploads/**
            **/storage/logs/**
          dangerous-clean-slate: false
