---
deployment:
  tasks:
    # 1. Copy web root files to public_html
    - /bin/cp -rf dist/hostycare_bundle/public_html/* /home/realtime/public_html/
    - /bin/cp -f dist/hostycare_bundle/public_html/.htaccess /home/realtime/public_html/
    
    # 2. Copy backend modules to sensor_app (outside public_html)
    - /bin/cp -rf dist/hostycare_bundle/sensor_app/* /home/realtime/sensor_app/
